# Serve the control room and the live status files from one origin.
#
#   /                  charger-control-room.html (one offline file)
#   /status/*.json     written atomically by charger_monitor --snapshot-file
#   /journals/*        OPTIONAL: read-only copies of the journals, for ?journal=
#
# The dashboard polls /status/ with fetch(), which browsers only allow from the
# same origin: that is why one server block carries both. Nothing here accepts
# a write, and the monitor opens no listening socket of its own.
#
# Journals are billing records. Keep this block on the plant LAN, behind your
# access control; the allow/deny and auth lines below are placeholders.
server {
    listen 8080;
    server_name _;

    # --- access control: REPLACE with your network and identity provider ---
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;
    # auth_basic "charger control room";
    # auth_basic_user_file /etc/nginx/charger.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    limit_except GET HEAD { deny all; }

    location = / {
        root /opt/charger/dashboard;
        try_files /charger-control-room.html =404;
        add_header Cache-Control "no-cache";
    }

    location /status/ {
        alias /run/charger/status/;
        autoindex off;
        default_type application/json;
        # Always the newest file: a cached status would hide a dead monitor.
        add_header Cache-Control "no-store";
    }

    location /journals/ {
        alias /var/lib/charger/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }
}
